</style></head><body><main><header><div><span class="brand">ARENA ORIGINAL / COURIER PROJECT</span><h1>SKYLINE COURIER</h1></div><div class="row"><button id="sound" class="small" aria-pressed="false">Sound off</button><button id="lang" class="small">한국어</button></div></header>

<script>
'use strict';
const $=id=>document.getElementById(id),c=$('board'),g=c.getContext('2d'),W=800,H=500;
const routes=[{en:'Harbor Dawn',ko:'새벽 항구',desc:['Quiet docks, gentle traffic.','조용한 항구와 완만한 교통량.'],target:7,time:40,speed:.24,spawn:.9,sky:'#253d58',ground:'#29485b',glow:'#f4bf83'},{en:'Neon Junction',ko:'네온 교차로',desc:['Dense city lanes and faster cargo.','복잡한 도심과 빨라진 화물.'],target:10,time:45,speed:.30,spawn:.78,sky:'#241f4e',ground:'#31345d',glow:'#e18bf5'},{en:'Storm Overpass',ko:'폭풍 고가도로',desc:['High-speed route through a storm.','폭풍 속의 고속 배송 루트.'],target:13,time:50,speed:.36,spawn:.69,sky:'#13283a',ground:'#173c46',glow:'#8cdbff'}];
const upgrades=[{en:'Armor',ko:'아머',cost:30},{en:'Boost',ko:'부스트',cost:35},{en:'Magnet',ko:'자석',cost:40}];
let ko=false,muted=true,audio=null,selected=0,unlocked=0,credits=0,levels=[0,0,0],bests=[0,0,0],cleared=[false,false,false],s=null,raf=0,last=0,phase='menu',gesture=null;
const tr=(en,kr)=>ko?kr:en,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=()=>Math.random(),put=(id,v)=>{$(id).textContent=v};
function sound(f,d=.11,delay=0){if(muted||!audio)return;try{let o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+delay;o.type='triangle';o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(.06,t+.018);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+d+.02)}catch{}}
function toggleSound(){muted=!muted;if(!muted){try{audio ||=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});sound(520)}catch{muted=true}}$('sound').setAttribute('aria-pressed',String(!muted));put('sound',muted?tr('Sound off','소리 꺼짐'):tr('Sound on','소리 켜짐'))}
function switchView(next){phase=next;for(const id of ['menu','play','result'])$(id).hidden=id!==next;window.scrollTo(0,0)}
function art(r,i){let nodes=Array.from({length:7},(_,j)=>'<rect x="'+(j*44)+'" y="'+(38+(j*19+i*13)%52)+'" width="36" height="100" rx="2" fill="#101d2c" opacity=".7"/>').join('');return '<svg viewBox="0 0 320 105" aria-hidden="true"><rect width="320" height="105" fill="'+r.sky+'"/><circle cx="245" cy="30" r="19" fill="'+r.glow+'"/>'+nodes+'<path d="M70 105L138 42H182L250 105" fill="#10202e" stroke="'+r.glow+'" stroke-width="2"/><path d="M160 43V105" stroke="#fff" opacity=".7" stroke-dasharray="6 6"/><path d="M160 65L173 91H147Z" fill="#8cf0cc"/></svg>'}
function cost(i){return upgrades[i].cost*(levels[i]+1)}
function renderMenu(){const r=routes[selected];put('intro',tr('Deliver energy parcels across three districts. Dodge hazards, protect your courier and spend earned credits on upgrades.','세 개의 구역에서 에너지 화물을 배송하세요. 장애물을 피하고 코어를 보호하며 획득한 크레딧으로 장비를 강화하세요.'));put('district-title',tr('Delivery route','배송 루트'));put('credits',tr('CREDITS ','크레딧 ')+credits);put('garage-title',tr('Courier garage','쿠리어 차고'));put('rank',tr('DISTRICTS CLEARED ','클리어 구역 ')+cleared.filter(Boolean).length+'/3');const d=$('districts');d.replaceChildren();routes.forEach((x,i)=>{let b=document.createElement('button');b.className='district';b.dataset.route=String(i);b.disabled=i>unlocked;b.setAttribute('aria-pressed',String(i===selected));let a=document.createElement('div');a.className='art';a.innerHTML=art(x,i);let tag=document.createElement('span');tag.className='badge';tag.textContent='0'+(i+1)+(cleared[i]?' / '+tr('CLEAR','완료'):i>unlocked?' / '+tr('LOCKED','잠금'):'');let title=document.createElement('strong');title.textContent=ko?x.ko:x.en;let info=document.createElement('small');info.textContent=x.time+'s · '+x.target+' '+tr('parcels','화물');b.append(a,tag,title,info);b.onclick=()=>{selected=i;renderMenu()};d.append(b)});put('route-description',r.desc[+ko]);put('start',tr('Start delivery','배송 시작'));const u=$('upgrades');u.replaceChildren();upgrades.forEach((x,i)=>{let b=document.createElement('button');b.dataset.upgrade=String(i);b.disabled=levels[i]>=3||credits<cost(i);let name=document.createElement('b');name.textContent=(ko?x.ko:x.en)+' Lv.'+levels[i];let sub=document.createElement('small');sub.textContent=levels[i]>=3?'MAX':cost(i)+' '+tr('credits','크레딧');b.append(name,sub);b.onclick=()=>{if(levels[i]<3&&credits>=cost(i)){credits-=cost(i);levels[i]++;sound(660);renderMenu()}};u.append(b)});put('local-note',tr('Progress is kept during this visit only. No account, payment or external data transfer.','현재 접속 중에만 성장 기록이 유지됩니다. 계정, 결제, 외부 데이터 전송은 없습니다.'));put('mission-title',tr('Delivery objective','배송 목표'));put('mission-copy',tr('Reach the parcel quota and survive until time runs out. Unlock the next district on success.','목표 화물 수를 채우고 제한 시간까지 생존하면 다음 구역이 해금됩니다.'));put('mission-target',r.target+' '+tr('PARCELS','화물'))}
function translate(){document.documentElement.lang=ko?'ko':'en';put('lang',ko?'English':'한국어');put('sound',muted?tr('Sound off','소리 꺼짐'):tr('Sound on','소리 켜짐'));put('parcel-label',tr('PARCELS','화물'));put('time-label',tr('TIME','시간'));put('hp-label',tr('ARMOR','아머'));put('score-label',tr('SCORE','점수'));put('pause',tr('Pause','일시정지'));put('quit',tr('End route','경로 종료'));put('paused-title',tr('Paused','일시정지'));put('resume',tr('Resume','계속'));put('controls-note',tr('Arrow keys or tap a lane. Space activates boost. Green parcels, gold credits, blue repair capsules. Avoid red barriers.','방향키 또는 차선을 터치하세요. 스페이스로 부스트. 초록 화물, 금색 크레딧, 파란 수리 캡슐을 모으고 빨간 장애물을 피하세요.'));put('foot',tr('First-party commercial candidate · prototype under evaluation · no live rankings','자체 상용화 후보 · 평가 전 프로토타입 · 실시간 순위 없음'));put('retry',tr('Retry','재도전'));put('garage',tr('Garage','차고'));put('next',tr('Next district','다음 구역'));put('result-parcels-label',tr('DELIVERED','배송'));put('result-credit-label',tr('CREDITS','크레딧'));put('result-best-label',tr('BEST','최고 점수'));put('result-chain-label',tr('COMBO','최대 콤보'));renderMenu();if(s){put('route-name',ko?routes[s.route].ko:routes[s.route].en);if(phase==='result')renderResult();hud()}}
function start(){cancelAnimationFrame(raf);let r=routes[selected];s={route:selected,time:r.time,elapsed:0,lane:1,visualLane:1,objects:[],spawn:.25,parcels:0,score:0,hp:3+levels[0],maxhp:3+levels[0],chain:0,maxchain:0,earned:0,boost:0,cooldown:0,invuln:0,fx:[],ended:false,success:false,reason:'',waves:0};switchView('play');$('paused').hidden=true;c.hidden=false;put('route-name',ko?r.ko:r.en);put('status',tr('Delivery started','배송 시작'));put('pause',tr('Pause','일시정지'));$('pause').disabled=false;controls(true);hud();draw();c.focus({preventScroll:true});if(!muted&&audio)audio.resume().catch(()=>{});sound(440);last=performance.now();raf=requestAnimationFrame(loop)}
function controls(on){$('left').disabled=!on;$('right').disabled=!on;$('boost').disabled=!on||!!s?.cooldown}
function hud(){if(!s)return;let r=routes[s.route];put('parcels',s.parcels+'/'+r.target);put('time',Math.ceil(Math.max(0,s.time)));put('hp',s.hp+'/'+s.maxhp);put('score',s.score);$('progress').style.width=clamp(s.parcels/r.target*100,0,100)+'%';put('boost',s.cooldown>0?tr('Boost ','부스트 ')+Math.ceil(s.cooldown)+'s':tr('Boost ready','부스트 준비'));$('boost').disabled=phase!=='play'||s.cooldown>0}
function move(n){if(phase!=='play')return;s.lane=clamp(n,0,2);sound(280,.05);put('status',tr('Lane ','차선 ')+(s.lane+1))}
function boost(){if(phase!=='play'||s.cooldown>0)return;s.boost=2.2+levels[1]*.45;s.cooldown=10-levels[1]*1.1;sound(210,.2);sound(520,.2,.08);put('status',tr('Boost active · protected','부스트 활성 · 보호 상태'));hud()}
function spawn(){let lane=Math.floor(rnd()*3),i=s.waves++;let type=i%5===0?'parcel':i%7===0?'repair':i%4===0?'coin':rnd()<.64?'parcel':'barrier';s.objects.push({lane,z:0,type,hit:false,wave:i});if(type==='parcel'&&i%4===0)s.objects.push({lane:(lane+1)%3,z:0,type:'barrier',hit:false,wave:i})}
function effect(color){for(let i=0;i<9;i++){let a=rnd()*6.283,v=40+rnd()*90;s.fx.push({x:laneX(s.visualLane,1),y:420,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45,color})}}
function hit(o){o.hit=true;switch(o.type){case'barrier':if(s.boost>0||s.invuln>0){s.score+=5;effect('#a4f4d6');sound(230);break}s.hp--;s.chain=0;s.invuln=.8;effect('#f6808a');sound(140,.18);put('status',tr('Armor damaged','아머 손상'));if(s.hp<=0)finish(false,'armor');break;case'parcel':s.parcels++;s.chain++;s.maxchain=Math.max(s.chain,s.maxchain);s.score+=10+Math.min(15,s.chain*2);effect('#8cf0cc');sound(530+Math.min(s.chain,8)*35);put('status',tr('Parcel collected · combo ','화물 획득 · 콤보 ')+s.chain);break;case'coin':s.earned+=3;s.score+=4;effect('#ffdb80');sound(820);break;case'repair':s.hp=Math.min(s.maxhp,s.hp+1);effect('#8cdbff');sound(420,.16);break}}
function update(dt){let r=routes[s.route];s.elapsed+=dt;s.time-=dt;s.boost=Math.max(0,s.boost-dt);s.cooldown=Math.max(0,s.cooldown-dt);s.invuln=Math.max(0,s.invuln-dt);s.visualLane+=(s.lane-s.visualLane)*Math.min(1,dt*12);s.spawn-=dt;if(s.spawn<=0){spawn();s.spawn=r.spawn}for(let o of s.objects){let prev=o.z;o.z+=dt*r.speed*(1+s.elapsed/r.time*.25);if(!o.hit&&prev<.91&&o.z>=.91){let distance=Math.abs(o.lane-s.lane);if(distance===0||o.type==='parcel'&&levels[2]>0&&distance===1&&o.wave%(4-levels[2])===0)hit(o);else if(o.type==='parcel')s.chain=0;else if(o.type==='barrier')s.score+=2}if(phase!=='play')return}s.objects=s.objects.filter(o=>o.z<1.15&&!o.hit);for(let p of s.fx){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}s.fx=s.fx.filter(p=>p.life>0);if(s.time<=0){s.time=0;finish(s.parcels>=r.target,s.parcels>=r.target?'delivered':'quota');return}hud()}
function laneX(lane,z){return 400+(lane-1)*(42+z*174)}function yAt(z){return 158+z*270}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}function polygon(points,color){g.fillStyle=color;g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}function txt(x,y,v,color,size){g.fillStyle=color;g.font='700 '+size+'px system-ui';g.textAlign='center';g.fillText(v,x,y)}
function draw(){if(!s)return;let r=routes[s.route],bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,r.sky);bg.addColorStop(1,'#091523');rect(0,0,W,H,bg);circle(630,84,45,r.glow);for(let i=0;i<19;i++){let x=i*47-10,h=35+(i*71+s.route*29)%110;rect(x,156-h,39,h,'#142535');for(let a=0;a<3;a++)for(let b=0;b<Math.floor(h/17);b++)if((i+a+b)%4===0)rect(x+5+a*10,160-h+b*17,4,6,r.glow+'88')}rect(0,158,W,H-158,r.ground);polygon([[344,158],[456,158],[790,H],[10,H]],'#101d2b');for(let k=0;k<2;k++){let l=k+.5;for(let j=0;j<14;j++){let z=((j/14+s.elapsed*.43)%1),z2=z+.035;polygon([[laneX(l,z)-2,yAt(z)],[laneX(l,z)+2,yAt(z)],[laneX(l,z2)+5,yAt(z2)],[laneX(l,z2)-5,yAt(z2)]],'#7091a2a0')}}for(let side of [-1,1]){g.strokeStyle=r.glow+'aa';g.lineWidth=3;g.beginPath();g.moveTo(400+side*56,158);g.lineTo(400+side*390,H);g.stroke()}if(s.route===2){g.strokeStyle='#8cdbff40';g.lineWidth=1;for(let i=0;i<32;i++){let x=(i*79+s.elapsed*310)%W,y=(i*53+s.elapsed*410)%H;g.beginPath();g.moveTo(x,y);g.lineTo(x-9,y+26);g.stroke()}}
for(let o of s.objects.sort((a,b)=>a.z-b.z)){let z=o.z,x=laneX(o.lane,z),y=yAt(z),size=8+z*22;if(o.type==='barrier'){polygon([[x-size,y+size*.7],[x-size*.65,y-size*.6],[x+size*.65,y-size*.6],[x+size,y+size*.7]],'#e85d72');rect(x-size*.6,y-4,size*1.2,7,'#fff2a8');txt(x,y+size*.55,'!', '#391a29',size)}else if(o.type==='parcel'){circle(x,y,size*1.4,'#8cf0cc22');rect(x-size*.8,y-size*.7,size*1.6,size*1.4,'#8cf0cc');rect(x-3,y-size*.7,6,size*1.4,'#275852');txt(x,y+5,'✦','#173c38',size*.85)}else if(o.type==='coin'){circle(x,y,size,'#f4c965');circle(x,y,size*.65,'#9b7337');txt(x,y+5,'C','#ffe6a0',size)}else{circle(x,y,size,'#8cdbff');rect(x-3,y-size*.55,6,size*1.1,'#20446b');rect(x-size*.55,y-3,size*1.1,6,'#20446b')}}
let x=laneX(s.visualLane,1),y=432;if(s.boost>0){circle(x,y,57,'#8cf0cc22');g.strokeStyle='#8cf0cc';g.lineWidth=3;g.beginPath();g.arc(x,y,49,0,6.283);g.stroke()}if(s.invuln<=0||Math.floor(s.elapsed*12)%2===0){polygon([[x-28,y+22],[x-12,y-24],[x+12,y-24],[x+28,y+22]],'#81e5c8');polygon([[x-13,y-24],[x,y-37],[x+13,y-24],[x+10,y-4],[x-10,y-4]],'#e4faff');rect(x-13,y-1,26,21,'#24465b');rect(x-32,y+14,12,22,'#182838');rect(x+20,y+14,12,22,'#182838');rect(x-6,y+25,12,13,s.boost>0?'#f7f9a0':'#79a8e9')}for(let p of s.fx){g.globalAlpha=p.life/.45;circle(p.x,p.y,3,p.color)}g.globalAlpha=1;txt(400,28,'COMBO ×'+s.chain,'#e3fff4',18)}
function loop(now){if(phase!=='play')return;let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();if(phase==='play')raf=requestAnimationFrame(loop)}
function pause(){if(phase!=='play')return;phase='paused';cancelAnimationFrame(raf);$('paused').hidden=false;c.hidden=true;controls(false);$('pause').disabled=true;put('status',tr('Paused','일시정지'))}
function resume(){if(phase!=='paused')return;phase='play';$('paused').hidden=true;c.hidden=false;$('pause').disabled=false;controls(true);last=performance.now();c.focus({preventScroll:true});raf=requestAnimationFrame(loop)}
function finish(success,reason){if(!s||s.ended)return;s.ended=true;s.success=success;s.reason=reason;cancelAnimationFrame(raf);let reward=s.earned+(success?15+s.route*10+s.parcels:Math.floor(s.parcels/2));s.reward=reward;credits+=reward;bests[s.route]=Math.max(bests[s.route],s.score);if(success){cleared[s.route]=true;unlocked=Math.max(unlocked,Math.min(2,s.route+1));sound(440,.16);sound(660,.2,.18);sound(880,.25,.38)}else sound(160,.22);switchView('result');renderResult()}
function renderResult(){let r=routes[s.route],reason={armor:tr('Armor depleted','아머 소진'),quota:tr('Parcel quota not reached','화물 목표 미달'),delivered:tr('Delivery complete','배송 성공'),quit:tr('Route ended','경로 종료')}[s.reason];put('result-tag',s.success?'MISSION COMPLETE':'ROUTE REPORT');put('result-title',(ko?r.ko:r.en)+' · '+reason);put('result-score',s.score);put('result-detail',s.success?tr('Route completed. Earned credits can upgrade your courier.','경로 완료. 획득한 크레딧으로 쿠리어를 강화할 수 있습니다.'):tr('Try a different lane strategy or upgrade your equipment.','차선 전략을 바꾸거나 장비를 강화해 보세요.'));put('result-parcels',s.parcels+'/'+r.target);put('result-credit','+'+s.reward);put('result-best',bests[s.route]);put('result-chain',s.maxchain);$('next').disabled=!s.success||s.route>=2}
$('sound').onclick=toggleSound;$('lang').onclick=()=>{ko=!ko;translate()};$('start').onclick=start;$('left').onclick=()=>move(s.lane-1);$('right').onclick=()=>move(s.lane+1);$('boost').onclick=boost;$('pause').onclick=pause;$('resume').onclick=resume;$('quit').onclick=()=>{if(phase==='play'||phase==='paused')finish(false,'quit')};$('retry').onclick=()=>{selected=s.route;start()};$('garage').onclick=()=>{switchView('menu');renderMenu()};$('next').onclick=()=>{if(s.success&&s.route<2){selected=s.route+1;switchView('menu');renderMenu()}};
function point(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}c.addEventListener('pointerdown',e=>{if(phase!=='play')return;let p=point(e);gesture=p;move(clamp(Math.floor(p.x*3),0,2));c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerup',e=>{if(phase==='play'&&gesture){let p=point(e),dx=p.x-gesture.x;if(Math.abs(dx)>.18)move(s.lane+(dx>0?1:-1))}gesture=null});c.addEventListener('pointercancel',()=>gesture=null);window.addEventListener('keydown',e=>{if(phase!=='play'||e.target?.tagName==='BUTTON')return;if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(!e.repeat){if(e.key===' ')boost();else move(s.lane+(e.key==='ArrowLeft'?-1:1))}}});window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});translate();
</script></body></html>
