'use strict';const games=[{id:'neon',name:'Neon Drift',genre:'Arcade',desc:['Dodge incoming obstacles and survive the neon highway.','네온 도로에서 장애물을 피하고 살아남으세요.'],color:'#8b5cf6',goal:20},{id:'orbit',name:'Orbit Defender',genre:'Action',desc:['Aim and destroy incoming asteroids before they reach the core.','코어에 접근하는 소행성을 조준하고 파괴하세요.'],color:'#38bdf8',goal:12},{id:'tiles',name:'Memory Bloom',genre:'Puzzle',desc:['Find all matching pairs of colorful symbols.','같은 기호의 카드 8쌍을 모두 찾아보세요.'],color:'#f59e0b',goal:8}];let lang=0,view='home',filter='All',query='',current=null,session=null,raf=0,stars=0,rec=true,period='all';const $=id=>document.getElementById(id),t=(a,b)=>lang?b:a;let store={sessions:[],ratings:{}};try{const s=JSON.parse(localStorage.getItem('arena-v1'));if(s&&Array.isArray(s.sessions)&&s.ratings)store=s}catch{};store.drafts=Array.isArray(store.drafts)?store.drafts:[];function syncGames(){games.splice(3);for(const d of store.drafts)if(d.status==='approved')games.push({...d,external:true,color:'#526d8f',desc:[d.description,d.description]})}syncGames();function save(){try{localStorage.setItem('arena-v1',JSON.stringify(store))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(g){const cutoff=view!=='play'&&period==='week'?Date.now()-7*864e5:view!=='play'&&period==='month'?Date.now()-30*864e5:0;const ss=store.sessions.filter(s=>s.id===g.id&&s.date>=cutoff),valid=ss.filter(s=>s.seconds>=30&&s.inputs>0),r=store.ratings[g.id],rating=r&&r.date>=cutoff?r:null;const avg=valid.length?valid.reduce((a,s)=>a+s.seconds,0)/valid.length:0;const completion=valid.length?valid.filter(s=>s.complete).length/valid.length:0;const score=valid.length&&rating?(25*Math.min(avg/180,1)+20*(rating.stars-1)/4+10*completion+5*(rating.rec?1:0))/60*100:null;return{plays:ss.length,valid:valid.length,avg,score,rating}}function art(g){if(g.thumb)return `<img src="${esc(g.thumb)}" alt="" style="width:100%;height:100%;object-fit:cover">`;let shapes=g.id==='neon'?'<path d="M0 160L125 55H195L320 160" fill="#10152d" stroke="#a78bfa" stroke-width="3"/><path d="M160 60V160" stroke="#a78bfa" stroke-dasharray="12 12"/><rect x="140" y="104" width="40" height="38" rx="7" fill="#c4ff83"/><rect x="148" y="108" width="24" height="13" rx="3" fill="#24364b"/>':g.id==='orbit'?'<circle cx="160" cy="80" r="44" fill="#153d65" stroke="#7dd3fc" stroke-width="3"/><ellipse cx="160" cy="80" rx="91" ry="30" fill="none" stroke="#7dd3fc" transform="rotate(-25 160 80)"/><circle cx="70" cy="45" r="12" fill="#dbeafe"/><circle cx="253" cy="115" r="18" fill="#64748b"/>':Array.from({length:8},(_,i)=>`<rect x="${65+i%4*48}" y="${30+Math.floor(i/4)*54}" width="40" height="44" rx="8" fill="${['#fbbf24','#fb7185','#a3e635','#67e8f9'][i%4]}" opacity=".85"/><circle cx="${85+i%4*48}" cy="${52+Math.floor(i/4)*54}" r="8" fill="#1e293b"/>`).join('');return `<svg viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg${g.id}" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="${g.color}"/></linearGradient></defs><rect width="320" height="160" fill="url(#bg${g.id})"/>${shapes}</svg>`}function cards(){return games.filter(g=>(filter==='All'||g.genre===filter)&&g.name.toLowerCase().includes(query.toLowerCase())).map(g=>{let s=stats(g);return `<article class="card"><div class="art">${art(g)}</div><div class="content"><span class="pill">${g.genre} · ${g.external?"EXTERNAL":"DEMO"}</span><h3>${esc(g.name)}</h3><p class="muted">${esc(g.desc[lang])}</p><div class="row"><span class="muted">${s.plays} ${t('plays','플레이')} · ${s.rating?'★ '+s.rating.stars:'—'}</span><button class="primary" onclick="openGame('${g.id}')">▶ ${t('Play','플레이')}</button></div></div></article>`}).join('')||`<p>${t('No games found','검색 결과 없음')}</p>`}function ranking(){let rows=games.filter(g=>!g.external).map(g=>({g,...stats(g)})).sort((a,b)=>(b.score??-1)-(a.score??-1)||b.valid-a.valid||a.g.id.localeCompare(b.g.id));let n=0;return `<div class="notice">${t('Local demo ranking: duration, satisfaction, completion and recommendation only. Not an official GPS ranking.','로컬 데모 순위: 지속 시간·만족도·완료·추천만 반영합니다. 공식 GPS 순위가 아닙니다.')}</div><div class="row"><h2>${t('Leaderboard','게임 순위')}</h2><select onchange="period=this.value;render()"><option value="all" ${period==='all'?'selected':''}>${t('All time','전체')}</option><option value="week" ${period==='week'?'selected':''}>${t('Last 7 days','최근 7일')}</option><option value="month" ${period==='month'?'selected':''}>${t('Last 30 days','최근 30일')}</option></select></div><table class="rank"><thead><tr><th>#</th><th>GAME</th><th>${t('Valid plays','유효 플레이')}</th><th>${t('Rating','평가')}</th><th>${t('Demo score','데모 점수')}</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${s.score===null?'—':++n}</td><td><button onclick="openGame('${s.g.id}')">${s.g.name}</button></td><td>${s.valid}</td><td>${s.rating?'★ '+s.rating.stars:'—'}</td><td><em>${s.score===null?t('Pending','평가 대기'):s.score.toFixed(1)}</em></td></tr>`).join('')}</tbody></table>`}function render(){document.documentElement.lang=lang?'ko':'en';$('lang').textContent=lang?'English':'한국어';$('nav').innerHTML=[['home',t('Discover','홈')],['games',t('Games','게임')],['rank',t('Rankings','순위')],['dev',t('Developer','개발자 센터')],['admin',t('Admin','관리자')]].map(([v,n])=>`<button class="${view===v?'active':''}" onclick="go('${v}')">${n}</button>`).join('');if(view==='play'){if(current.external){renderExternal();return}renderPlay();return}if(view==='dev'){renderDev();return}if(view==='admin'){renderAdmin();return}let html=view==='home'?`<section class="hero"><span class="tag">THE NEXT GENERATION OF GAMES</span><h1>${t('Play today. Discover tomorrow’s hits.','오늘 플레이하고, 내일의 흥행작을 발견하세요.')}</h1><p>${t('Test new AI-assisted game concepts. Your play and feedback shape what gets published next.','새로운 AI 게임을 테스트하고, 플레이와 평가를 통해 다음 퍼블리싱 후보를 발굴하세요.')}</p><button class="primary" onclick="go('games')">${t('Explore games','게임 탐색')} →</button><small>TECHNICAL PREVIEW · PLAY / RATE / PUBLISH</small></section><div class="kpis"><div class="kpi"><span class="muted">${t('Available games','등록 게임')}</span><strong>${games.length}</strong></div><div class="kpi"><span class="muted">${t('My sessions','내 플레이')}</span><strong>${store.sessions.length}</strong></div><div class="kpi"><span class="muted">${t('My reviews','내 평가')}</span><strong>${Object.keys(store.ratings).length}</strong></div></div>`:'';if(view==='home'||view==='games')html+=`<div class="row section"><h2>${t('Discover games','게임 탐색')}</h2><div class="row"><input id="search" placeholder="${t('Search games','게임 검색')}" value="${esc(query)}" oninput="query=this.value;$('cards').innerHTML=cards()"><select onchange="filter=this.value;$('cards').innerHTML=cards()">${['All','Arcade','Action','Puzzle'].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid" id="cards">${cards()}</div>`;if(view==='rank'||view==='home')html+=`<section class="panel">${ranking()}</section>`;if(view==='home')html+=`<section class="panel"><span class="tag">PUBLISHING PROGRAM · PREVIEW</span><h2>${t('From prototype to launch','프로토타입에서 정식 출시까지')}</h2><p>${t('Future candidates will be reviewed for hosting, QA, localization and publishing support. Demo scores do not grant funding.','향후 서버·QA·현지화·퍼블리싱 지원 후보를 별도 심사합니다. 데모 점수로 지원이 확정되지는 않습니다.')}</p></section>`; $('app').innerHTML=html+`<footer>${t('Prototype · sample games · browser-local data only · no real accounts or funding','프로토타입 · 샘플 게임 · 브라우저 로컬 데이터 · 실제 계정 및 지원금 미연동')}</footer>`}function go(v){if(view==='play'&&session?.running)finish(false);view=v;render()}$('lang').onclick=()=>{if(session?.running){if(!confirm(t('End current game to switch language?','언어를 변경하면 현재 게임을 종료합니다. 계속할까요?')))return;finish(false)}lang=1-lang;render()};function openGame(id){if(session?.running)finish(false);current=games.find(g=>g.id===id);if(!current)return;session=null;stars
