'use strict';const games=[{id:'neon',name:'Neon Drift',genre:'Arcade',desc:['Dodge incoming obstacles and survive the neon highway.','네온 도로에서 장애물을 피하고 살아남으세요.'],color:'#8b5cf6',goal:20},{id:'orbit',name:'Orbit Defender',genre:'Action',desc:['Aim and destroy incoming asteroids before they reach the core.','코어에 접근하는 소행성을 조준하고 파괴하세요.'],color:'#38bdf8',goal:12},{id:'tiles',name:'Memory Bloom',genre:'Puzzle',desc:['Find all matching pairs of colorful symbols.','같은 기호의 카드 8쌍을 모두 찾아보세요.'],color:'#f59e0b',goal:8}];let lang=0,view='home',filter='All',query='',current=null,session=null,raf=0,stars=0,rec=true,period='all';const $=id=>document.getElementById(id),t=(a,b)=>lang?b:a;let store={sessions:[],ratings:{}};try{const s=JSON.parse(localStorage.getItem('arena-v1'));if(s&&Array.isArray(s.sessions)&&s.ratings)store=s}catch{};store.drafts=Array.isArray(store.drafts)?store.drafts:[];function syncGames(){games.splice(3);for(const d of store.drafts)if(d.status==='approved')games.push({...d,external:true,color:'#526d8f',desc:[d.description,d.description]})}syncGames();function save(){try{localStorage.setItem('arena-v1',JSON.stringify(store))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(g){const cutoff=view!=='play'&&period==='week'?Date.now()-7*864e5:view!=='play'&&period==='month'?Date.now()-30*864e5:0;const ss=store.sessions.filter(s=>s.id===g.id&&s.date>=cutoff),valid=ss.filter(s=>s.seconds>=30&&s.inputs>0),r=store.ratings[g.id],rating=r&&r.date>=cutoff?r:null;const avg=valid.length?valid.reduce((a,s)=>a+s.seconds,0)/valid.length:0;const completion=valid.length?valid.filter(s=>s.complete).length/valid.length:0;const score=valid.length&&rating?(25*Math.min(avg/180,1)+20*(rating.stars-1)/4+10*completion+5*(rating.rec?1:0))/60*100:null;return{plays:ss.length,valid:valid.length,avg,score,rating}}function art(g){if(g.thumb)return `<img src="${esc(g.thumb)}" alt="" style="width:100%;height:100%;object-fit:cover">`;let shapes=g.id==='neon'?'<path d="M0 160L125 55H195L320 160" fill="#10152d" stroke="#a78bfa" stroke-width="3"/><path d="M160 60V160" stroke="#a78bfa" stroke-dasharray="12 12"/><rect x="140" y="104" width="40" height="38" rx="7" fill="#c4ff83"/><rect x="148" y="108" width="24" height="13" rx="3" fill="#24364b"/>':g.id==='orbit'?'<circle cx="160" cy="80" r="44" fill="#153d65" stroke="#7dd3fc" stroke-width="3"/><ellipse cx="160" cy="80" rx="91" ry="30" fill="none" stroke="#7dd3fc" transform="rotate(-25 160 80)"/><circle cx="70" cy="45" r="12" fill="#dbeafe"/><circle cx="253" cy="115" r="18" fill="#64748b"/>':Array.from({length:8},(_,i)=>`<rect x="${65+i%4*48}" y="${30+Math.floor(i/4)*54}" width="40" height="44" rx="8" fill="${['#fbbf24','#fb7185','#a3e635','#67e8f9'][i%4]}" opacity=".85"/><circle cx="${85+i%4*48}" cy="${52+Math.floor(i/4)*54}" r="8" fill="#1e293b"/>`).join('');return `<svg viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg${g.id}" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="${g.color}"/></linearGradient></defs><rect width="320" height="160" fill="url(#bg${g.id})"/>${shapes}</svg>`}function cards(){return games.filter(g=>(filter==='All'||g.genre===filter)&&g.name.toLowerCase().includes(query.toLowerCase())).map(g=>{let s=stats(g);return `<article class="card"><div class="art">${art(g)}</div><div class="content"><span class="pill">${g.genre} · ${g.external?"EXTERNAL":"DEMO"}</span><h3>${esc(g.name)}</h3><p class="muted">${esc(g.desc[lang])}</p><div class="row"><span class="muted">${s.plays} ${t('plays','플레이')} · ${s.rating?'★ '+s.rating.stars:'—'}</span><button class="primary" onclick="openGame('${g.id}')">▶ ${t('Play','플레이')}</button></div></div></article>`}).join('')||`<p>${t('No games found','검색 결과 없음')}</p>`}function ranking(){let rows=games.filter(g=>!g.external).map(g=>({g,...stats(g)})).sort((a,b)=>(b.score??-1)-(a.score??-1)||b.valid-a.valid||a.g.id.localeCompare(b.g.id));let n=0;return `<div class="notice">${t('Local demo ranking: duration, satisfaction, completion and recommendation only. Not an official GPS ranking.','로컬 데모 순위: 지속 시간·만족도·완료·추천만 반영합니다. 공식 GPS 순위가 아닙니다.')}</div><div class="row"><h2>${t('Leaderboard','게임 순위')}</h2><select onchange="period=this.value;render()"><option value="all" ${period==='all'?'selected':''}>${t('All time','전체')}</option><option value="week" ${period==='week'?'selected':''}>${t('Last 7 days','최근 7일')}</option><option value="month" ${period==='month'?'selected':''}>${t('Last 30 days','최근 30일')}</option></select></div><table class="rank"><thead><tr><th>#</th><th>GAME</th><th>${t('Valid plays','유효 플레이')}</th><th>${t('Rating','평가')}</th><th>${t('Demo score','데모 점수')}</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${s.score===null?'—':++n}</td><td><button onclick="openGame('${s.g.id}')">${s.g.name}</button></td><td>${s.valid}</td><td>${s.rating?'★ '+s.rating.stars:'—'}</td><td><em>${s.score===null?t('Pending','평가 대기'):s.score.toFixed(1)}</em></td></tr>`).join('')}</tbody></table>`}function render(){document.documentElement.lang=lang?'ko':'en';$('lang').textContent=lang?'English':'한국어';$('nav').innerHTML=[['home',t('Discover','홈')],['games',t('Games','게임')],['rank',t('Rankings','순위')],['dev',t('Developer','개발자 센터')],['admin',t('Admin','관리자')]].map(([v,n])=>`<button class="${view===v?'active':''}" onclick="go('${v}')">${n}</button>`).join('');if(view==='play'){if(current.external){renderExternal();return}renderPlay();return}if(view==='dev'){renderDev();return}if(view==='admin'){renderAdmin();return}let html=view==='home'?`<section class="hero"><span class="tag">THE NEXT GENERATION OF GAMES</span><h1>${t('Play today. Discover tomorrow’s hits.','오늘 플레이하고, 내일의 흥행작을 발견하세요.')}</h1><p>${t('Test new AI-assisted game concepts. Your play and feedback shape what gets published next.','새로운 AI 게임을 테스트하고, 플레이와 평가를 통해 다음 퍼블리싱 후보를 발굴하세요.')}</p><button class="primary" onclick="go('games')">${t('Explore games','게임 탐색')} →</button><small>TECHNICAL PREVIEW · PLAY / RATE / PUBLISH</small></section><div class="kpis"><div class="kpi"><span class="muted">${t('Available games','등록 게임')}</span><strong>${games.length}</strong></div><div class="kpi"><span class="muted">${t('Local sessions','로컬 플레이')}</span><strong>${store.sessions.length}</strong></div><div class="kpi"><span class="muted">${t('Local reviews','로컬 평가')}</span><strong>${Object.keys(store.ratings).length}</strong></div></div>`:'';if(view==='home'||view==='games')html+=`<div class="row section"><h2>${t('Discover games','게임 탐색')}</h2><div class="row"><input id="search" placeholder="${t('Search games','게임 검색')}" value="${esc(query)}" oninput="query=this.value;$('cards').innerHTML=cards()"><select onchange="filter=this.value;$('cards').innerHTML=cards()">${['All','Arcade','Action','Puzzle'].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid" id="cards">${cards()}</div>`;if(view==='rank'||view==='home')html+=`<section class="panel">${ranking()}</section>`;if(view==='home')html+=`<section class="panel"><span class="tag">PUBLISHING PROGRAM · PREVIEW</span><h2>${t('From prototype to launch','프로토타입에서 정식 출시까지')}</h2><p>${t('Future candidates will be reviewed for hosting, QA, localization and publishing support. Demo scores do not grant funding.','향후 서버·QA·현지화·퍼블리싱 지원 후보를 별도 심사합니다. 데모 점수로 지원이 확정되지는 않습니다.')}</p></section>`; $('app').innerHTML=html+`<footer>${t('Prototype · sample games · browser-local data only · no real accounts or funding','프로토타입 · 샘플 게임 · 브라우저 로컬 데이터 · 실제 계정 및 지원금 미연동')}</footer>`}function go(v){if(view==='play'&&session?.running)finish(false);view=v;render()}$('lang').onclick=()=>{if(session?.running){if(!confirm(t('End current game to switch language?','언어를 변경하면 현재 게임을 종료합니다. 계속할까요?')))return;finish(false)}lang=1-lang;render()};function openGame(id){if(session?.running)finish(false);current=games.find(g=>g.id===id);if(!current)return;session=null;stars=store.ratings[id]?.stars||0;rec=store.ratings[id]?.rec??true;view='play';render()}function renderPlay(){let s=stats(current),rated=store.ratings[current.id];$('app').innerHTML=`<button onclick="go('games')">← ${t('Back to games','게임 목록')}</button><div class="row"><h1>${current.name}</h1><span class="pill">${current.genre} / DEMO</span></div><p>${current.desc[lang]}</p><div class="panel"><div class="row"><span id="hud">${t('Ready to play','플레이 준비')}</span><button id="start" class="primary" onclick="startGame()">${t('Start game','게임 시작')}</button><button id="stop" onclick="finish(false)" disabled>${t('End session','종료')}</button></div><canvas id="game" width="640" height="360" aria-label="Game canvas"></canvas><div id="control" class="controls"></div><p class="muted">${current.id==='neon'?t('Arrow keys / A D / touch buttons','방향키 / A D / 터치 버튼'):current.id==='orbit'?t('Click or tap asteroids','소행성을 클릭 또는 터치'):t('Tap two cards to find a pair','카드 두 장을 눌러 짝을 찾으세요')}</p></div><section class="panel"><h2>${t('Rate this game','게임 평가')}</h2><p class="muted">${t('Requires a 30-second active session with input. One local rating per game; editable.','입력이 있는 30초 이상 활성 플레이 필요. 게임당 로컬 평가 1개, 수정 가능.')}</p><div class="stars" id="stars"></div><label><input type="checkbox" id="recommend" ${rec?'checked':''}> ${t('I recommend this game','이 게임을 추천합니다')}</label><p><textarea id="review" maxlength="500" placeholder="${t('Optional feedback','개선 의견 (선택)')}">${esc(rated?.review||'')}</textarea></p><button id="submit" class="primary" onclick="submitRating()" ${s.valid?'':'disabled'}>${t('Save rating','평가 저장')}</button><p id="feedback" role="status"></p></section>`;drawIdle();drawStars()}function drawStars(){$('stars').innerHTML=[1,2,3,4,5].map(n=>`<button aria-label="${n} stars" aria-pressed="${n===stars}" class="${n<=stars?'selected':''}" onclick="stars=${n};drawStars()">★</button>`).join('')}function submitRating(){if(!stats(current).valid||!stars){$('feedback').textContent=t('Play function renderAdmin(){let rows=store.drafts.flatMap(d=>d.versions.map(v=>({d,v}))).filter(x=>reviewFilter==='all'||x.v.status===reviewFilter);$('app').innerHTML=`<span class="tag">ADMIN / SIMULATION</span><h1>${t('Review queue','관리자 심사')}</h1><div class="notice">${t('No administrator authentication or malware scanner. Approval is local simulation only.','관리자 인증 및 악성코드 검사 미연동. 로컬 모의 심사입니다.')}</div><div class="row"><select onchange="reviewFilter=this.value;renderAdmin()">${['pending','approved','rejected','superseded','all'].map(s=>`<option value="${s}" ${reviewFilter===s?'selected':''}>${s==='all'?t('All','전체'):statusText(s)}</option>`).join('')}</select></div>${rows.map(({d,v})=>`<section class="panel"><div class="row"><h2>${esc(v.name)} · v${esc(v.label)}</h2><span class="pill">${statusText(v.status)}</span></div><p>${esc(v.description)}</p><p class="muted">${esc(v.kind==='zip'?v.filename+' · '+v.files+' files':v.url)} · ${esc(v.notes||'')}</p>${v.thumb?`<img class="thumb" src="${esc(v.thumb)}" alt="thumbnail">`:''}<div class="row"><button onclick="reviewPreview('${d.id}','${v.id}')">${t('Preview','미리보기')}</button>${v.status==='pending'?`<button class="primary" onclick="reviewDecision('${d.id}','${v.id}',true)">${t('Approve','승인')}</button><button onclick="reviewDecision('${d.id}','${v.id}',false)">${t('Reject','반려')}</button>`:''}</div><div id="preview${v.id}"></div></section>`).join('')||`<p>${t('No matching submissions','심사 내역 없음')}</p>`}`}
function reviewDecision(id,vid,ok){let d=store.drafts.find(x=>x.id===id),v=d.versions.find(x=>x.id===vid);if(v.status!=='pending')return;let reason=prompt(ok?t('Approval note (optional)','승인 메모 (선택)'):t('Rejection reason (required)','반려 사유 (필수)'),'');if(reason===null||(!ok&&!reason.trim()))return;if(ok&&d.active&&d.versions.find(x=>x.id===d.active).created>v.created){alert(t('A newer version is already live.','더 최신 버전이 게시 중입니다.'));return}change(()=>{v.status=ok?'approved':'rejected';v.reason=reason.slice(0,500);v.reviewed=Date.now();if(ok){for(let old of d.versions)if(old!==v&&old.status==='approved')old.status='superseded';d.active=v.id}})}
function frameFor(v,host){let f=document.createElement('iframe');f.className='externalframe';f.title=v.name;f.setAttribute('sandbox','allow-scripts');f.referrerPolicy='no-referrer';if(v.kind==='zip')f.srcdoc=v.html;else f.src=v.url;host.replaceChildren(f)}
function reviewPreview(id,vid){let v=store.drafts.find(x=>x.id===id).versions.find(x=>x.id===vid);frameFor(v,$('preview'+vid))}
function renderExternal(){$('app').innerHTML=`<button onclick="go('games')">← ${t('Back to games','게임 목록')}</button><div class="detail">${current.thumb?`<img class="thumb" src="${esc(current.thumb)}" alt="thumbnail">`:''}<div><span class="tag">${esc(current.genre)} · v${esc(current.label)}</span><h1>${esc(current.name)}</h1><p>${esc(current.description)}</p></div></div><section class="panel"><div class="notice">${t('Local preview only. Uploaded and external games do not contribute to demo ranking.','로컬 미리보기 전용. 업로드 및 외부 게임은 데모 순위에 반영되지 않습니다.')}</div><button class="primary" onclick="frameFor(current,$('externalhost'))">${t('Play game','게임 실행')}</button><div id="externalhost"></div><p class="muted">${esc(current.notes||'')}</p></section>`}

// Loaded inside the existing classic-script scope; local mode remains available.
const cfg=window.ARENA_CONFIG||{}, online=!!(cfg.url&&cfg.anonKey), db=online&&window.supabase?.createClient(cfg.url,cfg.anonKey);let account=null,role=null,board=[],versionMap={},ticket=null,externalRun=null;
const orig={render,renderDev,renderAdmin,ranking,startGame,finish,submitRating,go,renderExternal,frameFor};
const unwrap=({data,error})=>{if(error)throw Error(error.message);return data};const rpc=async(n,args={})=>unwrap(await db.rpc(n,args));const fail=e=>alert(e.message||String(e));
async function refresh(){let a=unwrap(await db.auth.getSession());account=a?.session?.user||null;role=account?unwrap(await db.from('profiles').select('role').eq('id',account.id).single()).role:null;let gs=unwrap(await db.from('games').select('*')),vs=unwrap(await db.from('versions').select('*'));versionMap=Object.fromEntries(gs.map(g=>[g.id,g.active]));store={sessions:[],ratings:{},drafts:[]};if(account){let ps=unwrap(await db.from('plays').select('*').eq('user_id',account.id)),rs=unwrap(await db.from('ratings').select('*').eq('user_id',account.id));for(let p of ps)if(p.ended){let v=vs.find(v=>v.id===p.version_id);if(v&&versionMap[v.game_id]===v.id)store.sessions.push({id:v.game_id,seconds:p.seconds,inputs:p.inputs,complete:p.completed,date:Date.parse(p.ended)})}for(let r of rs){let v=vs.find(v=>v.id===r.version_id);if(v&&versionMap[v.game_id]===v.id)store.ratings[v.game_id]={stars:r.stars,rec:r.recommend,review:r.review,date:Date.parse(r.updated)}}}for(let g of gs.filter(g=>g.owner)){let versions=await Promise.all(vs.filter(v=>v.game_id===g.id).map(async v=>{let thumb='';if(v.thumb_path){let r=await db.storage.from('arena-private').createSignedUrl(v.thumb_path,3600);thumb=r.data?.signedUrl||''}return {...v,label:v.label,created:Date.parse(v.created),thumb,filename:v.path||'',files:'',path:v.path}}));store.drafts.push({id:g.id,owner:g.owner,active:g.active,versions})}syncGames();board=await rpc('leaderboard',{p_days:period==='week'?7:period==='month'?30:3650});render()}
function authPanel(){let el=document.createElement('section');el.className='panel';el.innerHTML=`<h2>${t('Account','계정')}</h2>${account?`<p>${esc(account.email)} · ${esc(role)}</p><button id="logout">${t('Sign out','로그아웃')}</button>${role==='player'?'<button id="become">Become developer / 개발자 전환</button>':''}`:`<form id="authform" class="formgrid"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="primary" type="submit">Sign in / 로그인</button><button type="button" id="signup">Sign up / 회원가입</button></form>`}<p id="authmsg"></p>`;$('app').replaceChildren(el);if(account){$('logout').onclick=async()=>{try{unwrap(await db.auth.signOut());location.reload()}catch(e){fail(e)}};if($('become'))$('become').onclick=async()=>{try{await rpc('become_developer');await refresh()}catch(e){fail(e)}}}else{let submit=async signup=>{try{let f=$('authform');if(!f.reportValidity())return;let d=new FormData(f),args={email:d.get('email'),password:d.get('password')};let r=unwrap(await (signup?db.auth.signUp({...args,options:{emailRedirectTo:location.origin+location.pathname}}):db.auth.signInWithPassword(args)));if(r.session)await refresh();else $('authmsg').textContent='Check your email to confirm / 이메일 인증을 확인하세요.'}catch(e){$('authmsg').textContent=e.message}};$('authform').onsubmit=e=>{e.preventDefault();submit(false)};$('signup').onclick=()=>submit(true)}}
if(online){if(!db)throw Error('Supabase library unavailable');save=()=>{};persist=()=>false;
render=function(){orig.render();let nav=$('nav');nav.insertAdjacentHTML('beforeend',`<button onclick="go('account')">${account?'Account':'Sign in'}</button>`);if(view==='account')authPanel();let footer=document.querySelector('footer');if(footer)footer.textContent='Connected beta · provisional telemetry · no funding commitment';};
ranking=function(){let n=0;return `<div class="notice">Global beta / 글로벌 베타 · 300 unique players, 30 reviews, 7 days required for official eligibility. Client telemetry is provisional.</div><div class="row"><h2>Global rankings</h2><select onchange="period=this.value;refresh().catch(fail)"><option value="all" ${period==='all'?'selected':''}>All time</option><option value="week" ${period==='week'?'selected':''}>7 days</option><option value="month" ${period==='month'?'selected':''}>30 days</option></select></div><table class="rank"><tr><th>#</th><th>Game</th><th>Players</th><th>Reviews</th><th>Score</th></tr>${board.map(b=>`<tr><td>${b.eligible?++n:'—'}</td><td>${esc(b.name)}</td><td>${b.players}</td><td>${b.review_count}</td><td>${b.score??'—'}</td></tr>`).join('')}</table>`};
renderDev=function(){if(!['developer','admin'].includes(role)){authPanel();return}let all=store.drafts;store.drafts=all.filter(g=>g.owner===account.id);try{orig.renderDev()}finally{store.drafts=all}let notice=$('app').querySelector('.notice');notice.textContent='Online submissions · manual review required';$('devform').onsubmit=async e=>{e.preventDefault();let form=e.target,btn=form.querySelector('button[type=submit]');btn.disabled=true;try{let f=new FormData(form),kind=f.get('kind'),id=studioEdit||crypto.randomUUID(),base=account.id+'/'+crypto.randomUUID(),path=null,thumb=null,url=null;if(kind==='zip'){await packageGame(f.get('zip'));path=base+'/game.zip';unwrap(await db.storage.from('arena-private').upload(path,f.get('zip'),{contentType:'application/zip'}))}else{let u=new URL(f.get('url'));if(u.protocol!=='https:'||u.username||u.password)throw Error('HTTPS required');url=u.href}let tf=f.get('thumb');if(tf?.size){await thumbnail(tf);thumb=base+'/thumb.'+({'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[tf.type]);unwrap(await db.storage.from('arena-private').upload(thumb,tf,{contentType:tf.type}))}await rpc('submit_version',{p_game:id,p_label:f.get('version').trim(),p_name:f.get('title').trim(),p_genre:f.get('genre'),p_desc:f.get('description').trim(),p_notes:f.get('notes'),p_kind:kind,p_url:url,p_path:path,p_thumb:thumb});studioEdit=null;await refresh()}catch(e){if($('devfeedback'))$('devfeedback').textContent=e.message}finally{btn.disabled=false}}};
removeGame=()=>alert('Online deletion requires operator review.');renderAdmin=function(){if(role!=='admin'){ $('app').innerHTML='<p>Administrator access required.</p>';return}orig.renderAdmin();$('app').querySelector('.notice').textContent='Technical preview · automated security scan not connected. Only review packages from trusted test developers.'};
reviewDecision=async(id,vid,ok)=>{let reason=prompt(ok?'Approval note':'Rejection reason','');if(reason===null)return;try{await rpc('review_version',{p_id:vid,p_approve:ok,p_reason:reason});await refresh()}catch(e){fail(e)}};
frameFor=async(v,host)=>{try{if(v.kind==='zip'){let blob=unwrap(await db.storage.from('arena-private').download(v.path));let p=await packageGame(new File([blob],'game.zip'));orig.frameFor({...v,html:p.html},host)}else orig.frameFor(v,host)}catch(e){host.textContent=e.message}};
startGame=async()=>{if(!account){alert('Sign in to record global play.');return}if(session?.running||$('start').disabled)return;$('start').disabled=true;try{ticket=await rpc('start_play',{p_version:versionMap[current.id]});orig.startGame()}catch(e){$('start').disabled=false;fail(e)}};
finish=function(win){let s=session;if(!s?.running)return;let id=ticket;ticket=null;orig.finish(win);if(id){if($('submit'))$('submit').disabled=true;rpc('end_play',{p_id:id,p_seconds:Math.floor(s.seconds),p_inputs:s.inputs,p_completed:win}).then(()=>{if($('submit'))$('submit').disabled=!stats(current).valid}).catch(fail)}};
submitRating=async()=>{try{if(!stars)throw Error('Choose stars');await rpc('rate_game',{p_version:versionMap[current.id],p_stars:stars,p_recommend:$('recommend').checked,p_review:$('review').value});$('feedback').textContent='Saved to global database';}catch(e){$('feedback').textContent=e.message}};
async function stopExternal(){let r=externalRun;if(!r)return;externalRun=null;clearInterval(r.timer);window.removeEventListener('message',r.listener);r.frame?.remove();await rpc('end_play',{p_id:r.id,p_seconds:r.seconds,p_inputs:r.inputs,p_completed:r.completed});}
const oldGo=go;go=function(v){if(externalRun)stopExternal().catch(fail);oldGo(v)};
renderExternal=function(){orig.renderExternal();$('app').querySelector('.notice').textContent='HTTPS URL games are unranked. ZIP games use provisional SDK telemetry.';if(current.kind!=='zip')return;let g=current;let start=$('externalhost').previousElementSibling;start.onclick=async()=>{if(!account)return alert('Sign in first');if(externalRun)return;start.disabled=true;try{let id=await rpc('start_play',{p_version:versionMap[g.id]});await frameFor(g,$('externalhost'));let frame=$('externalhost').querySelector('iframe');if(!frame)throw Error('Game failed to load');let r={id,frame,token:crypto.randomUUID(),seconds:0,inputs:0,completed:false,ready:false};externalRun=r;r.listener=e=>{if(e.source!==frame.contentWindow||e.data?.arena!==1||e.data.token!==r.token)return;switch(e.data.event){case 'ready':r.ready=true;break;case 'input':if(r.ready&&document.visibilityState==='visible')r.inputs++;break;case 'complete':if(r.ready)r.completed=true;break}};window.addEventListener('message',r.listener);r.timer=setInterval(()=>{if(r.ready&&document.visibilityState==='visible')r.seconds++;if(!r.ready)frame.contentWindow.postMessage({arena:1,event:'init',token:r.token},'*')},1000);let stop=document.createElement('button');stop.textContent='End & record';stop.onclick=async()=>{try{await stopExternal();stop.remove();start.disabled=false;await refresh()}catch(e){fail(e)}};$('externalhost').after(stop)}catch(e){start.disabled=false;fail(e)}};$('app').insertAdjacentHTML('beforeend','<section class="panel"><h2>Rate this game</h2><label>Stars <select id="extstars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label><input id="extrec" type="checkbox" checked> Recommend</label><textarea id="extreview" maxlength="500" placeholder="Feedback"></textarea><button id="extrate">Submit rating</button><p id="extmsg"></p></section>');$('extrate').onclick=async()=>{try{await rpc('rate_game',{p_version:versionMap[g.id],p_stars:Number($('extstars').value),p_recommend:$('extrec').checked,p_review:$('extreview').value});$('extmsg').textContent='Saved'}catch(e){$('extmsg').textContent=e.message}}};
refresh().catch(e=>{$('app').textContent='Connection failed: '+e.message});
}
