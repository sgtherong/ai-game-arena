if($(id)){let b=$(id);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(key);session.inputs++};b.onpointerup=b.onpointercancel=()=>keys.delete(key)}$('game').onpointerdown=handleTap;raf=requestAnimationFrame(loop)}function handleTap(e){if(!session?.running||document.hidden)return;let r=$('game').getBoundingClientRect(),x=(e.clientX-r.left)*640/r.width,y=(e.clientY-r.top)*360/r.height,s=session;s.inputs++;if(current.id==='orbit'){let i=s.objects.findIndex(o=>Math.hypot(o.x-x,o.y-y)<o.r+10);if(i>=0){s.objects.splice(i,1);s.score++}}if(current.id==='tiles'&&!s.wait){let col=Math.floor((x-184)/70),row=Math.floor((y-40)/70),i=row*4+col;if(col<0||col>3||row<0||row>3||s.matched.includes(i)||s.flips.includes(i)||s.flips.length===2)return;s.flips.push(i);if(s.flips.length===2){if(s.deck[s.flips[0]]===s.deck[s.flips[1]]){s.matched.push(...s.flips);s.flips=[];s.score++}else s.wait=.7}}}function loop(now){let s=session;if(!s?.running)return;let dt=Math.min((now-s.last)/1000,.1);s.last=now;if(document.hidden||!document.hasFocus()){raf=requestAnimationFrame(loop);return}s.seconds+=dt;let c=ctx();c.fillStyle='#0b1322';c.fillRect(0,0,640,360);if(current.id==='neon'){if(keys.has('arrowleft')||keys.has('a'))s.x-=300*dt;if(keys.has('arrowright')||keys.has('d'))s.x+=300*dt;s.x=Math.max(35,Math.min(605,s.x));s.spawn+=dt;if(s.spawn>.65){s.spawn=0;s.objects.push({x:25+Math.random()*590,y:-30})}c.strokeStyle='#26344b';for(let x=80;x<640;x+=80){c.beginPath();c.moveTo(x,0);c.lineTo(x,360);c.stroke()}for(let o of s.objects){o.y+=190*dt;c.fillStyle='#a78bfa';c.fillRect(o.x-18,o.y,36,25);if(!o.hit&&Math.abs(o.x-s.x)<34&&o.y>290&&o.y<335){o.hit=true;s.hp--}if(o.y>360&&!o.hit){o.hit=true;s.score++}}s.objects=s.objects.filter(o=>o.y<390);c.fillStyle='#a3ef70';c.fillRect(s.x-18,310,36,32)}else if(current.id==='orbit'){s.spawn+=dt;if(s.spawn>.65){s.spawn=0;let a=Math.random()*Math.PI*2;s.objects.push({x:320+Math.cos(a)*310,y:180+Math.sin(a)*175,r:15})}c.fillStyle='#38bdf8';c.beginPath();
